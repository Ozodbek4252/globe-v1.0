# All Node tooling runs in Docker, so nothing needs installing on the host.
#
#   docker compose run --rm tools install     # first time, and whenever package.json changes
#   docker compose up dev                     # dev server on http://localhost:5173
#   docker compose run --rm tools run test    # also: lint, typecheck, build, format
#
# node_modules lives in a named volume (fast on Windows, invisible to the host editor).

x-node: &node
  image: node:26-slim
  working_dir: /app
  volumes:
    - .:/app
    - node_modules:/app/node_modules
  environment:
    VITE_USE_POLLING: '1'
    NPM_CONFIG_UPDATE_NOTIFIER: 'false'
    NPM_CONFIG_FUND: 'false'

services:
  dev:
    <<: *node
    command: ['npm', 'run', 'dev']
    ports:
      - '5173:5173'

  # One-off npm commands: `docker compose run --rm tools <npm args>`
  tools:
    <<: *node
    entrypoint: ['npm']
    profiles: ['tools']

  # Legacy-vs-new screenshot comparison in headless Chromium. Needs `dist/` (npm run build).
  #   docker compose run --rm parity node /opt/parity/shots.mjs [--scenarios a,b]
  # Lives with legacy/ and goes away when legacy/ is deleted.
  parity:
    build: ./legacy/parity
    profiles: ['parity']
    working_dir: /app
    init: true
    ipc: host
    volumes:
      - .:/app
      - ./legacy/parity/shots.mjs:/opt/parity/shots.mjs:ro

volumes:
  node_modules:
